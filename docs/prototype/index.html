<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Đối soát hóa đơn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#F7F8FA; --surface:#FFFFFF; --surface-2:#F0F2F6; --surface-3:#E4E8EF;
  --ink:#1A1F2B; --ink-2:#4A5468; --ink-3:#7A8699;
  --line:#DDE2EA; --line-2:#C8D0DC;
  --accent:#2A4A7F; --accent-ink:#FFFFFF; --accent-soft:#E8EEF7;
  --ok:#16794C; --ok-bg:#E7F5EE; --ok-line:#A8D9C2;
  --warn:#A16207; --warn-bg:#FEF6E0; --warn-line:#E8CE8A;
  --bad:#B42318; --bad-bg:#FEE7E5; --bad-line:#F0B4AE;
  --info:#475467; --info-bg:#F2F4F7;
  --shadow:0 1px 2px rgba(20,28,45,.06), 0 4px 12px rgba(20,28,45,.05);
  --shadow-lg:0 8px 32px rgba(20,28,45,.16);
  --r:8px; --r-sm:5px;
  --ui:"Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#12151C; --surface:#1A1F29; --surface-2:#212733; --surface-3:#2C3441;
  --ink:#E6E9EF; --ink-2:#A6B0C2; --ink-3:#77839A;
  --line:#2C3441; --line-2:#3C4655;
  --accent:#7EA6E0; --accent-ink:#0E1420; --accent-soft:#1B2536;
  --ok:#4ADE80; --ok-bg:#0F2A1E; --ok-line:#215E3E;
  --warn:#FACC15; --warn-bg:#2B2007; --warn-line:#6B5310;
  --bad:#F87171; --bad-bg:#2C0F0D; --bad-line:#6E2723;
  --info:#98A2B3; --info-bg:#1D2939;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 12px rgba(0,0,0,.3);
  --shadow-lg:0 8px 32px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --ground:#12151C; --surface:#1A1F29; --surface-2:#212733; --surface-3:#2C3441;
  --ink:#E6E9EF; --ink-2:#A6B0C2; --ink-3:#77839A;
  --line:#2C3441; --line-2:#3C4655;
  --accent:#7EA6E0; --accent-ink:#0E1420; --accent-soft:#1B2536;
  --ok:#4ADE80; --ok-bg:#0F2A1E; --ok-line:#215E3E;
  --warn:#FACC15; --warn-bg:#2B2007; --warn-line:#6B5310;
  --bad:#F87171; --bad-bg:#2C0F0D; --bad-line:#6E2723;
  --info:#98A2B3; --info-bg:#1D2939;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 12px rgba(0,0,0,.3);
  --shadow-lg:0 8px 32px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;text-wrap:balance;font-weight:600;letter-spacing:-.01em}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:500}
.mono{font-family:var(--mono)}
.muted{color:var(--ink-2)}
.dim{color:var(--ink-3)}
.eyebrow{font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- login ---------- */
#login{min-height:100%;display:grid;place-items:center;padding:32px 16px}
.loginbox{width:100%;max-width:380px}
.brandmark{display:flex;align-items:center;gap:10px;margin-bottom:28px}
.brandmark .bm{width:32px;height:32px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
.brandmark b{font-size:16px;font-weight:600;letter-spacing:-.02em}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:500;color:var(--ink-2);margin-bottom:5px}
.field input{width:100%;padding:9px 11px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface)}
.btn{border:1px solid transparent;border-radius:var(--r-sm);padding:9px 15px;font-weight:500;cursor:pointer;background:var(--surface-2);color:var(--ink);border-color:var(--line-2);transition:background .12s}
.btn:hover{background:var(--surface-3)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad-line)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.block{width:100%;justify-content:center}
.quickpick{margin-top:22px;border-top:1px solid var(--line);padding-top:18px}
.qp{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:9px 11px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);cursor:pointer;margin-top:8px}
.qp:hover{border-color:var(--accent);background:var(--accent-soft)}
.av{width:30px;height:30px;border-radius:50%;background:var(--surface-3);display:grid;place-items:center;font-weight:600;font-size:12px;flex:none;color:var(--ink-2)}

/* ---------- shell ---------- */
#app{display:grid;grid-template-columns:216px 1fr;min-height:100%}
#side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;max-height:100vh}
.sidehead{padding:16px 14px 12px}
.navgroup{padding:10px 8px 0}
.navgroup .eyebrow{padding:0 6px 6px}
.nav{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:7px 8px;border:0;background:transparent;border-radius:var(--r-sm);cursor:pointer;color:var(--ink-2);font-size:13.5px}
.nav:hover{background:var(--surface-2);color:var(--ink)}
.nav[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .ic{width:15px;text-align:center;flex:none;opacity:.85}
.nav .ct{margin-left:auto;font-size:11px;background:var(--surface-3);color:var(--ink-2);border-radius:20px;padding:1px 7px;font-family:var(--mono)}
.nav[aria-current="true"] .ct{background:var(--accent);color:var(--accent-ink)}
.sidefoot{margin-top:auto;padding:12px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink-3)}
#main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding:11px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.topbar h1{font-size:16px;margin-right:auto}
.page{padding:20px;max-width:1280px;width:100%}
.iconbtn{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-sm);width:31px;height:31px;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn:hover{background:var(--surface-2)}
.rolebadge{display:flex;align-items:center;gap:8px;border:1px solid var(--line-2);border-radius:20px;padding:3px 4px 3px 10px;font-size:12.5px}
.rolebadge b{font-weight:600}
.rolebadge select{border:0;background:var(--surface-2);border-radius:14px;padding:3px 6px;font-size:12px;cursor:pointer}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.cardhead{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.cardhead h3{font-size:13.5px}
.cardbody{padding:15px}
.grid{display:grid;gap:14px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:2px 8px;border-radius:20px;border:1px solid;white-space:nowrap}
.pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.pill.green{color:var(--ok);background:var(--ok-bg);border-color:var(--ok-line)}
.pill.yellow{color:var(--warn);background:var(--warn-bg);border-color:var(--warn-line)}
.pill.red{color:var(--bad);background:var(--bad-bg);border-color:var(--bad-line)}
.pill.grey{color:var(--info);background:var(--info-bg);border-color:var(--line-2)}
.code{font-family:var(--mono);font-size:11.5px;font-weight:600;padding:1px 6px;border-radius:4px;background:var(--surface-3);color:var(--ink-2);white-space:nowrap}
.code.red{background:var(--bad-bg);color:var(--bad)}
.code.yellow{background:var(--warn-bg);color:var(--warn)}
.code.grey{background:var(--info-bg);color:var(--info)}
.sev{width:3px;align-self:stretch;border-radius:3px;flex:none}
.sev.red{background:var(--bad)}.sev.yellow{background:var(--warn)}.sev.grey{background:var(--line-2)}
.empty{padding:40px 20px;text-align:center;color:var(--ink-3)}

/* ---------- tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--line-2);border-radius:var(--r);padding:13px 15px;cursor:pointer;text-align:left;box-shadow:var(--shadow);transition:transform .1s,border-color .12s}
.tile:hover{transform:translateY(-1px);border-color:var(--line-2)}
.tile.green{border-left-color:var(--ok)}.tile.yellow{border-left-color:var(--warn)}
.tile.red{border-left-color:var(--bad)}.tile.blue{border-left-color:var(--accent)}
.tile .tl{font-size:11.5px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.tile .tv{font-size:27px;font-weight:600;font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin:3px 0 1px}
.tile .ts{font-size:11.5px;color:var(--ink-3);font-family:var(--mono)}

/* ---------- tables ---------- */
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
.rowlink{cursor:pointer}
.rowlink:hover td{background:var(--surface-2)}
td.r,th.r{text-align:right}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:11px 15px;border-bottom:1px solid var(--line);background:var(--surface-2);border-radius:var(--r) var(--r) 0 0}
.filters input[type=search]{flex:1;min-width:150px;padding:6px 10px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface)}
.filters select{padding:6px 9px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface);cursor:pointer}

/* ---------- invoice detail ---------- */
.dethead{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:14px}
.dethead .hd{padding:14px 16px;display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.dethead h2{font-size:17px}
.tabs{display:flex;gap:2px;padding:0 10px;border-top:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:transparent;padding:9px 11px;cursor:pointer;color:var(--ink-2);font-size:13px;border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.split{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:14px;align-items:start}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:10px 18px}
.meta .k{font-size:11px;color:var(--ink-3);font-weight:500}
.meta .v{font-size:13.5px}
.lineblock{border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.lineblock > header{padding:9px 12px;background:var(--surface-2);display:flex;gap:9px;align-items:center;border-bottom:1px solid var(--line);flex-wrap:wrap}
.lineblock > header b{font-size:13px;font-weight:600}
.cmp{width:100%;font-size:13px}
.cmp th{padding:6px 10px;font-size:10.5px}
.cmp td{padding:6px 10px}
.cmp td.lbl{color:var(--ink-2);font-size:12.5px;width:96px}
.cmp tr.diff td{background:var(--bad-bg)}
.cmp tr.diff td.lbl{color:var(--bad);font-weight:500}
.cmp .vd{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.cmp .mk{width:26px;text-align:center;font-weight:700}
.cmp .mk.ok{color:var(--ok)}.cmp .mk.no{color:var(--bad)}
.lownote{border:1px dashed var(--warn);border-radius:4px;padding:0 4px;cursor:pointer;background:transparent;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px;color:inherit}
.lownote:hover{background:var(--warn-bg)}
.linefoot{padding:8px 12px;font-size:12.5px;display:flex;gap:8px;align-items:flex-start;border-top:1px solid var(--line)}
.linefoot.bad{background:var(--bad-bg);color:var(--bad)}
.linefoot.good{background:var(--ok-bg);color:var(--ok)}
.totals{border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden}
.totals table{font-size:13px}
.totals th{background:var(--surface-2)}
.totals tr.gr td{font-weight:700;background:var(--surface-2)}
.delta{font-family:var(--mono);font-variant-numeric:tabular-nums}
.delta.up{color:var(--bad)}
.delta.zero{color:var(--ink-3)}

/* viewer */
.viewer{position:sticky;top:76px}
.vtabs{display:flex;gap:4px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.vtab{border:1px solid var(--line-2);background:var(--surface);border-radius:4px;padding:3px 9px;font-size:12px;cursor:pointer}
.vtab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:500}
.paper{background:var(--surface-2);padding:14px;min-height:260px}
.sheet{background:var(--surface);border:1px solid var(--line-2);border-radius:3px;padding:14px;font-size:11.5px;line-height:1.65;box-shadow:var(--shadow)}
.sheet .st{text-align:center;font-weight:700;font-size:12.5px;letter-spacing:.04em;margin-bottom:2px}
.sheet .sl{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dotted var(--line-2);padding:2px 0}
.hl{background:var(--warn-bg);outline:2px solid var(--warn);border-radius:3px;padding:0 3px}
.evbox{padding:11px 14px;border-top:1px solid var(--line);font-size:12.5px}
.evrow{display:flex;justify-content:space-between;gap:10px;padding:2px 0}

/* exceptions */
.exc{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
.exc + .exc{margin-top:12px}
.exc > header{display:flex;gap:10px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.exc.red > header{background:var(--bad-bg)}
.exc.yellow > header{background:var(--warn-bg)}
.exc.grey > header{background:var(--info-bg)}
.exc > header .amt{margin-left:auto;font-family:var(--mono);font-weight:600}
.excbody{padding:14px}
.expl{max-width:68ch;margin-bottom:12px}
.kv{display:grid;grid-template-columns:78px 1fr;gap:4px 12px;font-size:12.5px;margin-bottom:12px}
.kv dt{color:var(--ink-3);font-weight:500}
.kv dd{margin:0;font-family:var(--mono);font-size:12px;overflow-wrap:anywhere}
.hint{display:flex;gap:8px;background:var(--surface-2);border-left:3px solid var(--accent);border-radius:0 4px 4px 0;padding:9px 12px;font-size:12.5px;margin-bottom:12px}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px;margin-bottom:10px}
.act{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--line-2);border-radius:var(--r-sm);padding:9px 11px;cursor:pointer;background:var(--surface)}
.act:hover{border-color:var(--accent)}
.act:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.act input{margin:2px 0 0}
.act .an{font-size:13px;font-weight:500}
.act .ad{font-size:11.5px;color:var(--ink-3)}
.star{color:var(--accent);font-size:11px;font-weight:600}
.resolved{display:flex;gap:9px;align-items:center;padding:10px 12px;background:var(--ok-bg);color:var(--ok);border-radius:var(--r-sm);font-size:13px}

/* journal / timeline / score */
.jrn td.acc{font-family:var(--mono);font-weight:600;width:64px}
.jrn tr.tot td{font-weight:700;background:var(--surface-2)}
.tline{position:relative;padding-left:22px}
.tline::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:var(--line-2)}
.tev{position:relative;padding:0 0 16px}
.tev::before{content:"";position:absolute;left:-21px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--accent);border:2px solid var(--surface)}
.tev.pending::before{background:var(--surface);border-color:var(--line-2)}
.tev .tt{font-size:11.5px;color:var(--ink-3);font-family:var(--mono)}
.tev .tx{font-size:13px}
.tev .td2{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.bar{height:7px;border-radius:4px;background:var(--surface-3);overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.bar.low i{background:var(--bad)}.bar.mid i{background:var(--warn)}.bar.high i{background:var(--ok)}

/* upload */
.drop{border:2px dashed var(--line-2);border-radius:var(--r);padding:34px 20px;text-align:center;background:var(--surface)}
.drop .big{font-size:15px;font-weight:600;margin-bottom:5px}
.prog{height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden;width:100%;min-width:60px}
.prog i{display:block;height:100%;background:var(--accent);transition:width .3s}

/* dialog */
dialog{border:0;border-radius:var(--r);padding:0;background:var(--surface);color:var(--ink);box-shadow:var(--shadow-lg);max-width:460px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(16,22,34,.5)}
dialog header{padding:14px 16px;border-bottom:1px solid var(--line);font-weight:600}
dialog .dbody{padding:16px}
dialog footer{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
textarea{width:100%;padding:8px 10px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface);resize:vertical;min-height:62px}
.callout{background:var(--warn-bg);color:var(--warn);border-radius:var(--r-sm);padding:9px 12px;font-size:12.5px;display:flex;gap:8px;margin:12px 0}
.sumline{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px dotted var(--line-2);font-size:13px}
.sumline:last-of-type{border-bottom:0}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:20px;font-size:13px;z-index:99;box-shadow:var(--shadow-lg);max-width:calc(100% - 32px)}

@media (max-width:920px){
  .split{grid-template-columns:1fr}
  .viewer{position:static}
}
@media (max-width:760px){
  #app{grid-template-columns:1fr}
  #side{position:static;height:auto;max-height:none;flex-direction:row;flex-wrap:wrap;align-items:center;gap:4px;padding:8px 12px;border-right:0;border-bottom:1px solid var(--line)}
  .sidehead{padding:0;margin-right:auto}
  .navgroup{display:flex;gap:3px;padding:0;overflow-x:auto;width:100%}
  .navgroup .eyebrow{display:none}
  .nav{width:auto;white-space:nowrap;font-size:12.5px}
  .sidefoot{display:none}
  .page{padding:14px 16px}
  .topbar{padding:10px 16px}
  .tile .tv{font-size:23px}
}
</style>

<section id="login">
  <div class="loginbox">
    <div class="brandmark"><span class="bm">Đ</span><b>Đối soát hóa đơn</b></div>
    <h2 style="font-size:19px;margin-bottom:4px">Đăng nhập</h2>
    <p class="muted" style="margin:0 0 20px;font-size:13px">Đối chiếu hóa đơn với đơn hàng và phiếu nhập.</p>
    <div class="field"><label for="lg-email">Email</label><input id="lg-email" type="email" autocomplete="username" placeholder="ten@xex.vn"></div>
    <div class="field"><label for="lg-pass">Mật khẩu</label><input id="lg-pass" type="password" autocomplete="current-password" placeholder="••••••••"></div>

/* ---------- helpers ---------- */
function byId(id){ for(var i=0;i<S.invoices.length;i++) if(S.invoices[i].id===id) return S.invoices[i]; return null; }
function openExcs(v){ return v.excs.filter(function(e){ return e.sev!=='grey' && !e.linked && !e.done; }); }
function deltaOf(v){ return v.inv.total - v.exp.total; }
function needsL2(v){
  if(v.total>L2_THRESHOLD) return 'Vượt ngưỡng 50.000.000 đ';
  if(v.excs.some(function(e){return e.done==='accept';})) return 'Có chênh lệch được chấp nhận';
  if(v.excs.some(function(e){return e.code.indexOf('FRD')===0;})) return 'Có dấu hiệu bất thường';
  return null;
}
function canApprove(v){
  if(v.status!=='MATCHED' && v.status!=='PENDING_L1' && v.status!=='PENDING_L2') return false;
  return openExcs(v).length===0;
}
function toast(msg){

  clearTimeout(toast._h); toast._h=setTimeout(function(){t.hidden=true;},2800);

function nowHM(){ var d=new Date(); return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); }

   + '<div class="row" style="flex-wrap:nowrap;padding:7px 0;border-bottom:1px solid var(--line)"><span style="flex:1;font-size:13px">Ngưỡng cần duyệt cấp 2</span><span class="num">50.000.000 đ</span></div>'
   + '<div class="row" style="flex-wrap:nowrap;padding:7px 0;border-bottom:1px solid var(--line)"><span style="flex:1;font-size:13px">Luôn cần cấp 2 khi</span><span style="font-size:12.5px;text-align:right">có chênh lệch được chấp nhận<br>có dấu hiệu bất thường<br>nhà cung cấp mới</span></div>'
   + '<div class="row" style="flex-wrap:nowrap;padding:7px 0"><span style="flex:1;font-size:13px">Tách biệt trách nhiệm</span><span class="pill green"><span class="dot"></span>Bật</span></div>'
   + '</div></div>';
  h+='<div class="callout">⚠ Thay đổi chỉ áp dụng cho hóa đơn xử lý từ thời điểm lưu. Hóa đơn đã đối chiếu giữ nguyên kết quả theo cấu hình lúc đó.</div>';
  h+='</div>';
  return h;
}

function vAudit(){
  if(S.me.role!=='CHIEF') return '<div class="card"><div class="empty">Chỉ kế toán trưởng xem được nhật ký kiểm toán.<br><br><button class="btn" data-role="ktt">Đổi sang vai trò kế toán trưởng</button></div></div>';
  var rows=[];
  S.invoices.forEach(function(v){ v.tl.forEach(function(e){ rows.push({t:e.t,who:e.x.split(' ')[0],act:e.x,inv:v.number,d:e.d}); }); });
  rows.reverse();
  var h='<div class="card"><div class="cardhead"><h3>Nhật ký kiểm toán</h3><button class="btn" style="margin-left:auto;padding:4px 10px;font-size:12px" data-export="audit">Xuất Excel</button></div><div class="tablewrap"><table><thead><tr><th>Thời điểm</th><th>Hóa đơn</th><th>Hành động</th><th>Chi tiết</th></tr></thead><tbody>';
  rows.forEach(function(r){ h+='<tr><td class="mono" style="font-size:12px;white-space:nowrap">'+esc(r.t)+'</td><td class="mono" style="font-size:12px">'+r.inv+'</td><td style="font-size:12.5px">'+esc(r.act)+'</td><td class="dim" style="font-size:12px">'+esc(r.d||'')+'</td></tr>'; });
  h+='</tbody></table></div></div>';
  return h;
}

/* ---------- render ---------- */
var TITLES={dashboard:'Tổng quan',upload:'Tải hóa đơn lên',invoices:'Hóa đơn',approvals:'Chờ duyệt',vendors:'Nhà cung cấp',documents:'Đơn hàng & phiếu nhập',config:'Cấu hình',audit:'Nhật ký kiểm toán',detail:'Chi tiết hóa đơn'};
function render(){
  var v=document.getElementById('view');
  var t=TITLES[S.screen]||'';
  if(S.screen==='detail'){ var iv=byId(S.inv); t = iv? 'Hóa đơn '+iv.number : 'Chi tiết'; }
  document.getElementById('pgtitle').textContent=t;
  document.getElementById('me-av').textContent=S.me.ini;
  document.getElementById('me-name').textContent=S.me.name;
  document.getElementById('me-switch').value=S.me.id;
  document.getElementById('admin-nav').hidden = S.me.role!=='CHIEF';
  document.getElementById('ct-inv').textContent=S.invoices.length;
  var q=S.invoices.filter(function(x){return x.status==='PENDING_L1'||x.status==='PENDING_L2';}).length;
  document.getElementById('ct-app').textContent=q;
  Array.prototype.forEach.call(document.querySelectorAll('.nav[data-go]'),function(b){
    b.setAttribute('aria-current', String(b.dataset.go===S.screen || (S.screen==='detail'&&b.dataset.go==='invoices')));
  });
  var html='';
  switch(S.screen){
    case 'dashboard': html=vDashboard(); break;
    case 'upload': html=vUpload(); break;
    case 'invoices': html=vInvoices(); break;
    case 'approvals': html=vApprovals(); break;
    case 'vendors': html=vVendors(); break;
    case 'documents': html=vDocuments(); break;
    case 'config': html=vConfig(); break;
    case 'audit': html=vAudit(); break;
    case 'detail': html=vDetail(); break;
  }
  v.innerHTML=html;
  if(S.screen==='invoices'){
    var f=S.filter||{q:'',cls:'',st:''};
    var e1=document.getElementById('fcls'), e2=document.getElementById('fst');
    if(e1) e1.value=f.cls; if(e2) e2.value=f.st;
  }
  window.scrollTo({top:0,behavior:'instant'});
}
function go(screen){ S.screen=screen; if(screen!=='detail'){S.inv=null;} render(); }
function openInv(id){ S.inv=id; S.tab='compare'; S.vtab='inv'; S.screen='detail'; render(); }

/* ---------- dialogs ---------- */
function dialog(title, body, footer, onOpen){
  var d=document.getElementById('dlg');
  document.getElementById('dlg-t').textContent=title;
  document.getElementById('dlg-b').innerHTML=body;
  document.getElementById('dlg-f').innerHTML=footer;
  d.showModal();
  if(onOpen) onOpen(d);
}
function closeDlg(){ document.getElementById('dlg').close(); }

function approveDialog(v,level){
  var accepted=v.excs.filter(function(e){return e.done==='accept';});
  var acceptedAmt=accepted.reduce(function(s,e){return s+e.amount;},0);
  var reason=needsL2(v);
  var b='<div class="sumline"><span>Hóa đơn</span><b class="mono">'+v.number+'</b></div>'
   + '<div class="sumline"><span>Nhà cung cấp</span><span>'+esc(v.vendor)+'</span></div>'
   + '<div class="sumline"><span>Tổng thanh toán</span><b class="num">'+money(v.exp.total)+' đ</b></div>';
  if(acceptedAmt) b+='<div class="sumline"><span>Chênh lệch được chấp nhận</span><b class="num" style="color:var(--bad)">'+money(acceptedAmt)+' đ</b></div>';
  if(level===1 && reason) b+='<div class="callout">⚠ Hóa đơn này sẽ cần kế toán trưởng duyệt cấp 2.<br>Lý do: '+esc(reason)+'</div>';
  if(level===2) b+='<div class="callout" style="background:var(--ok-bg);color:var(--ok)">✓ Sau khi duyệt, hóa đơn chuyển sang <b>Sẵn sàng thanh toán</b> và bút toán được chốt.</div>';
  b+='<label style="display:block;font-size:12px;color:var(--ink-2);margin:12px 0 5px" for="apnote">Ghi chú'+(level===1&&reason?' cho người duyệt cấp 2':'')+'</label><textarea id="apnote" placeholder="Không bắt buộc"></textarea>';
  dialog('Xác nhận duyệt cấp '+level, b,
    '<button class="btn" value="cancel">Hủy</button><button class="btn primary" id="apok" value="ok">Xác nhận duyệt</button>',
    function(){ document.getElementById('apok').addEventListener('click',function(){ doApprove(v,level,document.getElementById('apnote').value.trim()); }); });
}
function doApprove(v,level,note){
  var stamp = nowHM();
  if(level===1){
    v.l1={by:S.me.name,at:'hôm nay '+stamp,note:note};
    v.tl.push({t:'hôm nay '+stamp,x:S.me.name+' duyệt cấp 1',d:note||''});
    var reason=needsL2(v);
    if(reason){ v.status='PENDING_L2'; v.l2reason=reason; toast('Đã duyệt cấp 1. Chuyển kế toán trưởng duyệt cấp 2.'); }
    else { v.status='POSTED'; v.tl.push({t:'hôm nay '+stamp,x:'Hệ thống chốt bút toán',d:'Sẵn sàng thanh toán'}); toast('Đã duyệt và chốt bút toán.'); }
    log(S.me.name+' duyệt cấp 1 HĐ '+v.number);
  } else {
    v.l2={by:S.me.name,at:'hôm nay '+stamp,note:note};
    v.status='POSTED';
    v.tl.push({t:'hôm nay '+stamp,x:S.me.name+' duyệt cấp 2',d:note||''});
    v.tl.push({t:'hôm nay '+stamp,x:'Hệ thống chốt bút toán',d:'Sẵn sàng thanh toán · đã xuất Excel'});
    log(S.me.name+' duyệt cấp 2 HĐ '+v.number);
    toast('Đã duyệt cấp 2. Hóa đơn sẵn sàng thanh toán.');
  }
  closeDlg(); render();
}
function rejectDialog(v,kind){
  var isRet = kind==='return';
  dialog(isRet?'Trả lại để sửa':'Từ chối hóa đơn',
    '<p class="muted" style="margin:0 0 10px;font-size:13px">'+(isRet?'Hóa đơn quay về trạng thái đã đọc để sửa và chạy lại.':'Từ chối là trạng thái cuối. Hóa đơn sẽ không được ghi sổ hay thanh toán.')+'</p>'
    +'<label style="display:block;font-size:12px;color:var(--ink-2);margin-bottom:5px" for="rjr">Lý do (tối thiểu 10 ký tự)</label><textarea id="rjr"></textarea><p id="rjerr" class="dim" style="font-size:12px;margin:6px 0 0"></p>',
    '<button class="btn" value="cancel">Hủy</button><button class="btn '+(isRet?'':'danger')+'" id="rjok" value="ok">'+(isRet?'Trả lại':'Từ chối')+'</button>',
    function(){
      document.getElementById('rjok').addEventListener('click',function(ev){
        var r=document.getElementById('rjr').value.trim();
        if(r.length<10){ ev.preventDefault(); document.getElementById('rjerr').textContent='Cần ít nhất 10 ký tự. Hiện có '+r.length+'.'; document.getElementById('rjerr').style.color='var(--bad)'; return; }
        v.status = isRet?'RETURNED':'REJECTED';
        v.tl.push({t:'hôm nay '+nowHM(),x:S.me.name+(isRet?' trả lại':' từ chối'),d:'Lý do: '+r});
        log(S.me.name+(isRet?' trả lại ':' từ chối ')+'HĐ '+v.number);
        toast(isRet?'Đã trả lại để sửa.':'Đã từ chối hóa đơn.');
        closeDlg(); render();
      });
    });
}
function fixFieldDialog(v,key){
  var li=-1; v.lines.forEach(function(L,i){ if(L.low[key]!=null) li=i; });
  if(li<0){ toast('Trường này không có cảnh báo tin cậy.'); return; }
  var L=v.lines[li], cur=L.inv[key];
  dialog('Xác nhận giá trị đọc từ chứng từ',
    '<p class="muted" style="margin:0 0 12px;font-size:13px">Dòng '+(li+1)+' · '+esc(L.name)+' · đơn giá đọc với độ tin cậy <b style="color:var(--warn)">'+String(L.low[key]).replace('.',',')+'</b>, dưới ngưỡng 0,95 của trường tiền.</p>'
    +'<div class="sumline"><span>Nguồn</span><span class="mono">'+(v.fmt==='SCAN'?'ảnh scan trang 1, vùng (318, 512)':'dòng '+(li+1))+'</span></div>'
    +'<label style="display:block;font-size:12px;color:var(--ink-2);margin:12px 0 5px" for="fv">Giá trị</label>'
    +'<input id="fv" class="mono" style="width:100%;padding:8px 10px;border:1px solid var(--line-2);border-radius:5px;background:var(--surface)" value="'+cur+'">'
    +'<p class="dim" style="font-size:12px;margin:8px 0 0">Sau khi lưu, trường chuyển nguồn thành “sửa tay”, độ tin cậy 1,00, và hệ thống chạy lại từ bước tìm chứng từ.</p>',
    '<button class="btn" value="cancel">Hủy</button><button class="btn primary" id="fok" value="ok">Xác nhận giá trị</button>',
    function(){
      document.getElementById('fok').addEventListener('click',function(){
        var nv=parseInt(String(document.getElementById('fv').value).replace(/\D/g,''),10);
        if(!nv){ toast('Giá trị không hợp lệ.'); return; }
        var changed = nv!==cur;
        L.inv[key]=nv;
        if(key==='price'){ L.inv.net=nv*L.inv.qty; L.inv.tax=Math.round(L.inv.net*L.inv.rate/100); }
        delete L.low[key];
        recompute(v);
        v.tl.push({t:'hôm nay '+nowHM(),x:S.me.name+(changed?' sửa trường đơn giá':' xác nhận trường đơn giá'),d:changed?(money(cur)+' → '+money(nv)):'giữ nguyên '+money(nv)+' · nguồn chuyển thành sửa tay, tin cậy 1,00'});
        v.tl.push({t:'hôm nay '+nowHM(),x:'Hệ thống tính lại',d:'phân loại '+CLS[v.cls].n});
        log(S.me.name+(changed?' sửa':' xác nhận')+' đơn giá HĐ '+v.number);
        closeDlg(); render();
        toast(changed?'Đã sửa và tính lại. Phân loại: '+CLS[v.cls].n : 'Đã xác nhận. Phân loại: '+CLS[v.cls].n);
      });
    });
}
function recompute(v){
  var sub=0,tax=0;
  v.lines.forEach(function(L){ sub+=L.inv.net; tax+=L.inv.tax; });
  v.inv.sub=sub; v.inv.tax=tax; v.inv.total=sub+tax; v.total=v.inv.total;
  var anyLow=false; v.lines.forEach(function(L){ if(Object.keys(L.low).length) anyLow=true; });
  v.excs=v.excs.filter(function(e){ return !(e.code==='INT-01' && !anyLow); });
  v.lines.forEach(function(L){
    if(L.note && L.note.code==='INT-01' && !Object.keys(L.low).length){ L.note={cls:'good',text:'Khớp trong dung sai. Đơn giá đã được xác nhận thủ công.'}; }
  });
  var worst='green';
  v.excs.forEach(function(e){ if(e.done) return; if(e.sev==='red') worst='red'; else if(e.sev==='yellow'&&worst!=='red') worst='yellow'; });
  v.cls=worst;
  if(v.status==='MATCHED' && !openExcs(v).length) v.status='PENDING_L1';
}

/* ---------- events ---------- */
document.addEventListener('click',function(ev){
  var t=ev.target;
  var el;
  if((el=t.closest('[data-login]'))){ login(el.dataset.login); return; }
  if(t.id==='lg-go'){ login('ktv'); return; }
  if((el=t.closest('[data-go]'))){ go(el.dataset.go); return; }
  if((el=t.closest('[data-tilego]'))){
    var g=el.dataset.tilego;
    if(g==='__queue') go('approvals');
    else { S.filter={q:'',cls:g,st:''}; go('invoices'); }
    return;
  }
  if((el=t.closest('[data-inv]'))){ openInv(el.dataset.inv); return; }
  if((el=t.closest('[data-tab]'))){ S.tab=el.dataset.tab; render(); return; }
  if((el=t.closest('[data-vtab]'))){ S.vtab=el.dataset.vtab; render(); return; }
  if((el=t.closest('[data-vendor]'))){ S.vendor=parseInt(el.dataset.vendor,10); render(); return; }
  if((el=t.closest('[data-role]'))){ S.me=USERS[el.dataset.role]; render(); return; }
  if(t.id==='fclear'){ S.filter={q:'',cls:'',st:''}; render(); return; }
  if(t.id==='reset'){ S.invoices=norm(seed()); S.activity=[]; S.batch=null; S.filter=null; go('dashboard'); toast('Đã đặt lại dữ liệu demo.'); return; }
  if(t.id==='theme'){ toggleTheme(); return; }
  if(t.id==='simulate'){ simulate(); return; }
  if((el=t.closest('[data-import]'))){ toast('Bản demo dùng dữ liệu có sẵn — chức năng import chưa bật.'); return; }
  if((el=t.closest('[data-export]'))){ toast('Đã tạo file Excel bút toán (bản demo không tải file về).'); return; }

  var v=byId(S.inv);
  if(!v) return;
  if((el=t.closest('[data-fixfield]'))){ fixFieldDialog(v,el.dataset.fixfield); return; }
  if((el=t.closest('[data-appr]'))){ approveDialog(v,parseInt(el.dataset.appr,10)); return; }
  if(t.closest('[data-ret]')){ rejectDialog(v,'return'); return; }
  if(t.closest('[data-rej]')){ rejectDialog(v,'reject'); return; }
  if((el=t.closest('[data-resolve]'))){
    var i=parseInt(el.dataset.resolve,10), e=v.excs[i];
    var sel=document.querySelector('input[name="act'+i+'"]:checked');
    var choice=sel?sel.value:e.def;
    var rsn=(document.getElementById('rsn'+i).value||'').trim();
    if(choice!==e.def && rsn.length<10){ toast('Chọn khác đề xuất thì phải nhập lý do, tối thiểu 10 ký tự.'); return; }
    e.done=choice; e.reason=rsn;
    v.excs.forEach(function(o){ if(o.linked===e.code){ o.done=choice; o.reason='Tự đóng theo '+e.code; } });
    v.tl.push({t:'hôm nay '+nowHM(),x:S.me.name+' xử lý ngoại lệ '+e.code,d:ACTIONS[choice].n+(rsn?' — '+rsn:'')});
    recompute(v);
    if(!openExcs(v).length && v.status==='MATCHED') v.status='PENDING_L1';
    log(S.me.name+' xử lý '+e.code+' HĐ '+v.number);
    render(); toast('Đã lưu xử lý cho '+e.code+'.');
    return;
  }
  if((el=t.closest('[data-undo]'))){
    var j=parseInt(el.dataset.undo,10);
    v.excs[j].done=null; v.excs[j].reason='';
    v.excs.forEach(function(o){ if(o.linked===v.excs[j].code){ o.done=null; } });
    recompute(v); if(v.status==='PENDING_L1'&&openExcs(v).length) v.status='MATCHED';
    render(); return;
  }
});
document.addEventListener('input',function(ev){
  if(ev.target.id==='fq'){ S.filter=S.filter||{q:'',cls:'',st:''}; S.filter.q=ev.target.value;
    var tb=document.querySelector('#view table'); if(tb){ var keep=ev.target.selectionStart; render(); var f=document.getElementById('fq'); if(f){f.focus(); f.setSelectionRange(keep,keep);} } }
});
document.addEventListener('change',function(ev){
  if(ev.target.id==='me-switch'){ S.me=USERS[ev.target.value]; toast('Đang xem với vai trò '+S.me.roleName+'.'); render(); }
  if(ev.target.id==='fcls'){ S.filter=S.filter||{q:'',cls:'',st:''}; S.filter.cls=ev.target.value; render(); }
  if(ev.target.id==='fst'){ S.filter=S.filter||{q:'',cls:'',st:''}; S.filter.st=ev.target.value; render(); }
});

function login(which){
  S.me=USERS[which];
  document.getElementById('login').hidden=true;
  document.getElementById('app').hidden=false;
  go('dashboard');
}
function simulate(){
  S.batch={id:'#a7f3',done:0,files:[
    {name:'HD_00012457.xml',kind:'XML · 0,8 giây',res:'ok',cls:'red'},
    {name:'HD_00012458.pdf',kind:'PDF text · 2,1 giây',res:'ok',cls:'green'},
    {name:'scan_0460.jpg',kind:'OCR · 11,4 giây',res:'ok',cls:'yellow'},
    {name:'HD_00012441.pdf',kind:'PDF text · 1,9 giây',res:'ok',cls:'red'},
    {name:'HD_00012462.pdf',kind:'Bỏ qua',res:'dup',cls:null},
    {name:'anh_mo.jpg',kind:'Lỗi',res:'err',cls:null}
  ]};
  render();
  var iv=setInterval(function(){
    S.batch.done++;
    if(S.batch.done>=S.batch.files.length){ clearInterval(iv); toast('Đã xử lý xong lô #a7f3.'); }
    if(S.screen==='upload') render();
  },650);
}
function toggleTheme(){
  var r=document.documentElement;
  var cur=r.getAttribute('data-theme');
  if(!cur){ cur = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark':'light'; }
  var next = cur==='dark'?'light':'dark';
  r.setAttribute('data-theme',next);
  try{ localStorage.setItem('ds-theme',next); }catch(e){}
}
try{ var saved=localStorage.getItem('ds-theme'); if(saved) document.documentElement.setAttribute('data-theme',saved); }catch(e){}
})();
